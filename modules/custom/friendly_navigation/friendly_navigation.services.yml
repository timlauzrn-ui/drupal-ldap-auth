services:
  logger.channel.friendly_navigation:
    parent: logger.channel_base
    arguments: ['friendly_navigation']

  friendly_navigation.menu_sync:
    class: Drupal\friendly_navigation\Service\DepartmentMenuSync
    arguments:
      - '@entity_type.manager'
      - '@config.factory'
      - '@logger.channel.friendly_navigation'
      - '@department_access.resolver'

  friendly_navigation.config_subscriber:
    class: Drupal\friendly_navigation\EventSubscriber\DepartmentConfigMenuSubscriber
    arguments:
      - '@friendly_navigation.menu_sync'
    tags:
      - { name: event_subscriber }

hkcec_department_access.settings:
  type: config_object
  label: 'Department access settings'
  mapping:
    departments:
      type: sequence
      label: 'Departments'
      sequence:
        type: mapping
        mapping:
          id:
            type: string
            label: 'Machine ID'
          label:
            type: string
            label: 'Label'
          role:
            type: string
            label: 'Drupal role ID'
          folder_name:
            type: string
            label: 'Media folder name under Root'
    primary_department_priority:
      type: sequence
      label: 'Priority order when a user has multiple department roles'
      sequence:
        type: string

log_center.overview:
  path: '/admin/reports/log-center'
  defaults:
    _form: '\Drupal\log_center\Form\LogCenterOverviewForm'
    _title: 'Log Center'
  requirements:
    _permission: 'view log center'

log_center.detail:
  path: '/admin/reports/log-center/{log_id}'
  defaults:
    _controller: '\Drupal\log_center\Controller\LogCenterController::detail'
    _title: 'Log detail'
  requirements:
    _permission: 'view log center'
    log_id: \d+

log_center.export:
  path: '/admin/reports/log-center/export'
  defaults:
    _controller: '\Drupal\log_center\Controller\LogCenterController::export'
    _title: 'Export logs'
  requirements:
    _permission: 'view log center'

log_center.settings:
  path: '/admin/config/development/log-center'
  defaults:
    _form: '\Drupal\log_center\Form\LogCenterSettingsForm'
    _title: 'Log Center settings'
  requirements:
    _permission: 'administer log center'

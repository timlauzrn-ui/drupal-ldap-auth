log_center.settings:
  type: config_object
  label: 'Log Center settings'
  mapping:
    retention_days:
      type: integer
      label: 'Retention days'
    access_logging:
      type: boolean
      label: 'Enable access logging'
    skip_path_prefixes:
      type: sequence
      label: 'Skip path prefixes'
      sequence:
        type: string
    skip_extensions:
      type: sequence
      label: 'Skip file extensions'
      sequence:
        type: string

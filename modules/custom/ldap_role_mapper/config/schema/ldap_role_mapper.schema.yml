ldap_role_mapper.settings:
  type: config_object
  label: 'LDAP Role Mapper settings'
  mapping:
    mappings:
      type: sequence
      label: 'LDAP group to Drupal role mappings'
      sequence:
        type: mapping
        mapping:
          ldap_group:
            type: string
            label: 'LDAP group CN or DN'
          rid:
            type: string
            label: 'Drupal role ID'
    protected_roles:
      type: sequence
      label: 'Protected role IDs never removed by the mapper'
      sequence:
        type: string

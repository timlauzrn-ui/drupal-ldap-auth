services:
  logger.channel.department_access:
    parent: logger.channel_base
    arguments: ['department_access']

  department_access.resolver:
    class: Drupal\department_access\Service\DepartmentResolver
    arguments:
      - '@config.factory'
      - '@entity_type.manager'

  department_access.role_ensurer:
    class: Drupal\department_access\Service\DepartmentRoleEnsurer
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@logger.channel.department_access'

  department_access.folder_sync:
    class: Drupal\department_access\Service\DepartmentFolderSync
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@logger.channel.department_access'

  department_access.media_access:
    class: Drupal\department_access\Service\DepartmentMediaAccess
    arguments:
      - '@department_access.resolver'
      - '@current_user'

  department_access.config_subscriber:
    class: Drupal\department_access\EventSubscriber\DepartmentConfigSubscriber
    arguments:
      - '@department_access.role_ensurer'
      - '@department_access.folder_sync'
    tags:
      - { name: event_subscriber }
